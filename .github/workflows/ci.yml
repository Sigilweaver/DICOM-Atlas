name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python test deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]" maturin pydicom
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Build Rust workspace
        run: cargo build --release --workspace

      - name: Compile tags.dmap
        run: |
          cargo run --release --bin dmap-compile -- \
            --standard data/standard/attributes.json \
            --resolved data/resolved_pydicom_backfilled.jsonl \
            --out tags.dmap

      - name: Verify dmap row count
        run: |
          size=$(stat -c%s tags.dmap)
          if [ "$size" -lt 3000000 ]; then
            echo "::error::tags.dmap is suspiciously small: $size bytes"
            exit 1
          fi
          echo "tags.dmap size: $size bytes (ok)"

      - name: Rust tests
        run: cargo test --release --workspace

      - name: Install dicom_map Python extension (editable)
        working-directory: dicom-map-py
        run: python -m maturin develop --release

      - name: Python unit tests
        run: pytest tests/ -v

      - name: Python round-trip fuzz
        run: python tests/roundtrip_fuzz.py

      - name: Build Python wheel
        working-directory: dicom-map-py
        run: maturin build --release

      - name: Python smoke test
        working-directory: dicom-map-py
        run: |
          python -c "
          import dicom_map
          d = dicom_map.open('../tags.dmap')
          assert len(d) > 19000, f'dict too small: {len(d)}'
          t = d.lookup(0x0008, 0x0005)
          assert t and t['keyword'] == 'SpecificCharacterSet', t
          t = d.lookup(0x0021, 0x0008, 'Siemens: Thorax/Multix FD Lab Settings')
          assert t and t['vr'] == 'US', t
          print('python smoke OK')
          "

      - name: C FFI smoke test
        run: |
          gcc -Wall -Wextra -O2 \
            -I dicom-map-ffi/include \
            dicom-map-ffi/tests/smoke.c \
            -L target/release -ldicom_map_ffi \
            -o /tmp/dmap_smoke
          LD_LIBRARY_PATH=target/release /tmp/dmap_smoke

      - name: Upload tags.dmap
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: tags-dmap
          path: tags.dmap
          retention-days: 30

  docs:
    name: Docs (Docusaurus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: bun install
        run: bun install --frozen-lockfile
      - name: bun run build:cloudflare
        run: bun run build:cloudflare
