name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.0)"
        required: true

jobs:
  # ---------------------------------------------------------------
  # Build redistributable artifacts (tags.dmap, CLI, FFI tarballs)
  # ---------------------------------------------------------------
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build tags.dmap
        run: |
          cargo run --release --bin dmap-compile -- \
            --standard data/standard/attributes.json \
            --resolved data/resolved_pydicom_backfilled.jsonl \
            --out tags.dmap

      - name: Build CLI + FFI
        run: |
          cargo build --release --bin dicom-lookup -p dmap-compiler
          cargo build --release -p dicom-map-ffi

      - name: Package release artifacts
        run: |
          mkdir -p release
          cp tags.dmap release/
          cp target/release/dicom-lookup release/
          cp target/release/libdicom_map_ffi.so release/ || true
          cp target/release/libdicom_map_ffi.a release/ || true
          cp dicom-map-ffi/include/dicom_map.h release/
          cd release
          sha256sum * > SHA256SUMS
          tar czf ../dicom-map-linux-x86_64.tar.gz *

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            tags.dmap
            dicom-map-linux-x86_64.tar.gz
            release/SHA256SUMS
          generate_release_notes: true

  # ---------------------------------------------------------------
  # Publish Rust crates to crates.io via trusted publishing.
  # Order: dicom-map -> dmap-compiler / dicom-map-ffi (parallel).
  # ---------------------------------------------------------------
  publish-dicom-map:
    name: Publish dicom-map to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish dicom-map
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if cargo publish -p dicom-map --token "$CARGO_REGISTRY_TOKEN" 2>&1 | tee out.log; then
            exit 0
          fi
          grep -qi 'already uploaded\|already exists' out.log && exit 0 || exit 1

  publish-dmap-compiler:
    name: Publish dmap-compiler to crates.io
    needs: publish-dicom-map
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Wait for crates.io index
        run: sleep 30
      - name: cargo publish dmap-compiler
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if cargo publish -p dmap-compiler --token "$CARGO_REGISTRY_TOKEN" 2>&1 | tee out.log; then
            exit 0
          fi
          grep -qi 'already uploaded\|already exists' out.log && exit 0 || exit 1

  publish-dicom-map-ffi:
    name: Publish dicom-map-ffi to crates.io
    needs: publish-dicom-map
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Wait for crates.io index
        run: sleep 30
      - name: cargo publish dicom-map-ffi
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if cargo publish -p dicom-map-ffi --token "$CARGO_REGISTRY_TOKEN" 2>&1 | tee out.log; then
            exit 0
          fi
          grep -qi 'already uploaded\|already exists' out.log && exit 0 || exit 1

  # ---------------------------------------------------------------
  # Build Python wheels (manylinux, macOS, Windows) and publish the
  # `dicom-map` PyPI package via trusted publishing.
  # ---------------------------------------------------------------
  build-wheels:
    name: Build wheels (${{ matrix.os }}, ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "auto"
          - os: ubuntu-latest
            target: aarch64
            manylinux: "auto"
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: dicom-map-py
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter 3.8 3.9 3.10 3.11 3.12 3.13
          manylinux: ${{ matrix.manylinux }}
          sccache: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dicom-map-py/dist

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: dicom-map-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dicom-map-py/dist/*.tar.gz

  publish-pypi:
    name: Publish dicom-map to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
