# Dependency vulnerability audit for DICOM-Atlas.
#
# Runs cargo-audit against the RustSec Advisory DB on every push/PR that
# touches the lockfile or manifests, plus a weekly schedule so advisories
# published after the last dependency change are still caught.

name: Audit

on:
  push:
    branches: ["main"]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      # RUSTSEC-2026-0235 affects validation of attacker-controlled rkyv
      # archives. dicom-map only reads its own build-time-embedded, trusted
      # tags.dmap archive, so the vulnerable path is not reachable here.
      # Remove this waiver when dicom-map migrates to rkyv >= 0.8.17.
      - run: cargo audit --ignore RUSTSEC-2026-0235
