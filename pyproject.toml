[project]
name = "dicom-map-scraper"
version = "0.1.0"
description = "Scrape private DICOM tags from vendor conformance statements"
requires-python = ">=3.11"
dependencies = [
    "pdfplumber>=0.11",
    "pydantic>=2.6",
    "requests>=2.31",
    "rich>=13.7",
    "click>=8.1",
]

[project.optional-dependencies]
# ops tools used only during corpus maintenance
ops = [
    "internetarchive>=5.8.0",
]
dev = ["ruff>=0.4", "pytest>=8", "mypy>=1.10"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scraper*"]
