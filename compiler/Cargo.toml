[package]
name = "dmap-compiler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../README.md"
keywords.workspace = true
categories.workspace = true
description = "Compile ResolvedTag JSON-L into a frozen .dmap archive"

[[bin]]
name = "dmap-compile"
path = "src/main.rs"

[[bin]]
name = "dicom-lookup"
path = "src/bin/lookup.rs"

[dependencies]
dicom-map = { path = "../dicom-map", version = "0.2.1" }
rkyv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
csv = { workspace = true }

[features]
# Bake tags.dmap into the dicom-lookup binary. Build with:
#   cargo build --release --bin dicom-lookup --features embedded
# The binary will then work with no external .dmap file.
embedded = ["dicom-map/embedded"]
